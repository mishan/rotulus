[package]
name = "rotulus-mirc"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Parse IRC (mIRC) formatting codes into Rotulus styled text"
readme = "README.md"
keywords = ["irc", "mirc", "formatting", "chat"]
categories = ["parser-implementations", "text-processing"]

[lib]
crate-type = ["rlib"]

# Pure logic, like the layout engine it produces text for: no GTK, so it
# is tested headless.
[dependencies]
rotulus-layout = { workspace = true }
